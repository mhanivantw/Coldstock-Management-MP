const Offline = (() => {
  const clone=x=>JSON.parse(JSON.stringify(x));
  const validId=x=>typeof x==='string'&&/^[A-Za-z0-9-]{20,100}$/.test(x);
  function fingerprint(data,id){
    if(id.startsWith('@delivery:'))return Delivery.fingerprint(data,id.slice(10));
    const loc=data.locations.find(l=>l.id===id);
    const items=data.stock.filter(i=>i.locationId===id).map(i=>['id','locationId','sku','kp','exp','qty','unit','palletNo','spv','status','note','updatedAt','sessionId'].map(k=>i[k]??'').concat(i.palletId?[i.palletId,i.palletLabel]:[]));
    items.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
    return JSON.stringify([loc?['id','room','group','block','bay','slot','display','order','kind','functionType'].map(k=>loc[k]):null,items]);
  }
  function touched(data,request){
    if(request.action==='mergePallet'){
      const ids=new Set(request.ids||[]),out=new Set(data.stock.filter(i=>ids.has(i.id)).map(i=>i.locationId));out.add(request.destination);
      for(const d of data.deliveryNotes||[])if(d.state==='DRAFT'&&d.lines.some(l=>ids.has(l.itemId)))out.add('@delivery:'+d.id);
      return [...out].sort();
    }
    if(request.action==='moveBatch'){
      const ids=new Set((request.rows||[]).map(r=>r.itemId)),out=new Set();
      for(const r of request.rows||[]){out.add(r.from);out.add(r.destination);}
      for(const i of data.stock)if(ids.has(i.id))out.add(i.locationId);
      for(const d of data.deliveryNotes||[])if(d.state==='DRAFT'&&d.lines.some(l=>ids.has(l.itemId)))out.add('@delivery:'+d.id);
      return [...out].sort();
    }
    if(request.action==='bulkReceive')return [...new Set((request.rows||[]).map(r=>r.locationId))].sort();
    if(['saveDelivery','issueDelivery','cancelDelivery'].includes(request.action))return ['@delivery:'+request.documentId,...Delivery.locations(data,request)];
    if(request.action==='correctItem')return data.stock.filter(i=>i.id===request.itemId).map(i=>i.locationId);
    if(request.action==='saveSlot')return [request.locationId];
    const ids=new Set(request.ids||[]),out=new Set(data.stock.filter(i=>ids.has(i.id)).map(i=>i.locationId));
    if(request.action==='move')out.add(request.destination);return [...out].sort();
  }
  function apply(data,op,session){
    const request=clone(op.request);request.version=data.version;
    const minted=[];
    if(request.action==='saveSlot'){
      const oldIds=new Set(data.stock.map(i=>i.id));
      request.items.forEach(i=>{WMS.assert(validId(i.id),'ID item offline tidak valid.');if(!oldIds.has(i.id)){minted.push(i.id);delete i.id;}});
    }
    return Delivery.mutate(data,request,session,()=>{const id=minted.shift();WMS.assert(id,'ID baru tidak tersedia.');return id;},op.createdAt);
  }
  function initial(data){return {schema:1,revision:0,data:clone(data),queue:[],inflight:null,cachedAt:new Date().toISOString()};}
  function enqueue(state,request,session,uuid,now){
    WMS.assert(state.queue.length<500,'Antrean mencapai 500 transaksi. SYNC terlebih dahulu.');
    WMS.assert(request.version===state.data.version,'CONFLICT: Data di tab lain berubah. Muat ulang data.');
    const req=clone(request);if(req.action==='mergePallet'&&!req.palletId)req.palletId=uuid();if(req.action==='saveSlot')req.items.forEach(i=>{if(!i.id)i.id=uuid();});
    if(req.action==='bulkReceive')req.rows.forEach(r=>{if(!r.id)r.id=uuid();});
    const op={id:uuid(),createdAt:now,actor:clone(session),request:req,expected:{}};
    touched(state.data,req).forEach(id=>{op.expected[id]=fingerprint(state.data,id);});
    const data=apply(state.data,op,session);
    return {...clone(state),revision:state.revision+1,data,queue:state.queue.concat([op])};
  }
  function freeze(state,uuid){if(state.inflight)return state;WMS.assert(state.queue.length,'Antrean kosong.');return {...clone(state),revision:state.revision+1,inflight:{id:uuid(),operations:clone(state.queue)}};}
  function acknowledge(state,response){
    WMS.assert(state.inflight&&response.batchId===state.inflight.id,'Konfirmasi sinkronisasi tidak cocok. Antrean dipertahankan.');
    const sent=state.inflight.operations.map(op=>op.id);
    WMS.assert(JSON.stringify(sent)===JSON.stringify(response.ackIds),'Konfirmasi transaksi tidak lengkap. Antrean dipertahankan.');
    const ack=new Set(sent),queue=state.queue.filter(op=>!ack.has(op.id));let data=clone(response.data);
    // A timeout can be followed by more edits. Reapply the unsent suffix, never discard it.
    for(const op of queue){for(const id of touched(data,op.request))WMS.assert(op.expected[id]===fingerprint(data,id),'CONFLICT: Transaksi baru perlu ditinjau. Antrean dipertahankan.');data=apply(data,op,op.actor);}
    return {...state,revision:state.revision+1,data,queue,inflight:null,cachedAt:new Date().toISOString()};
  }
  function read(storage,key){let raw;try{raw=storage.getItem(key);}catch{throw new Error('Penyimpanan HP tidak tersedia. Izinkan penyimpanan situs pada browser.');}if(!raw)return null;let state;try{state=JSON.parse(raw);}catch{throw new Error('Data offline tidak terbaca. Jangan hapus penyimpanan browser; pulihkan cadangan.');}WMS.assert(state.schema===1&&Array.isArray(state.queue)&&state.data&&Array.isArray(state.data.stock),'Format data offline tidak dikenal.');return state;}
  function write(storage,key,state,expectedRevision){
    const current=read(storage,key);WMS.assert((current?.revision??null)===expectedRevision,'CONFLICT: Penyimpanan berubah di tab lain. Muat ulang data.');

    return state;
  }
  return {clone,validId,fingerprint,touched,apply,initial,enqueue,freeze,acknowledge,read,write};
})();

="status" aria-label="Status item ${n+1}">${opts(WMS.STATUS,it.status)}</select></div>${S.mode==='CSFG'?`<div><label class="label">Kode SPV <span style="color:#bc5757">*</span></label><select class="field" data-field="spv" aria-label="SPV item ${n+1}"><option value="">Pilih SPV</option>${opts(['JT','HW','AK','-'],it.spv)}</select></div>`:''}</div><label class="label">Keterangan</label><input class="field" data-field="note" maxlength="500" aria-label="Keterangan item ${n+1}" placeholder="Contoh: Retur dari Distributor A, kemasan rusak" value="${esc(it.note)}"><div class="editor-exp">Exp date: <span data-exp>${it.kp?WMS.expiry(it.kp,S.mode==='CSFG'?0:180):'—'}</span> · ${S.mode==='CSFG'?'mengikuti KP':'KP + 180 hari'}</div></div>`).join('')}</div><button class="btn add-item" data-action="add-item">${icon('plus',16)} Tambah item di lokasi ini</button>`,`${stockAt(ed.loc.id).length?btn('Barang keluar','empty-slot','','report'):''}<div class="row" style="gap:7px">${stockAt(ed.loc.id).length?btn('Pindah','move-slot','','move'):''}${stockAt(ed.loc.id).length?btn('Koreksi data','correction-open','',''):''}${btn('SAVE','save-slot','primary','check')}</div>`);}

function help(){openModal('Panduan Coldstock v1.6.1','Pencatatan stok, dari rak sampai laporan.',`<div class="help-content"><h3>1. Mulai sesi</h3><p>Pilih CSFG atau CHILLER, lalu isi nama, tanggal dan shift. Identitas dapat dipulihkan setelah refresh selama sesi aktif. Stok yang tersimpan tetap ada.</p><h3>2. Kelola stok</h3><p>Pilih ruangan dan blok, lalu ketuk slot. Dalam grid, lorong berada di utara/atas layar; baris depan (1, 3) di atas dan belakang (2, 4) di bawah. Slot bergaris miring tidak tersedia.</p><p>Gunakan Tambah item untuk lebih dari satu SKU. Tekan-tahan rak lalu tap rak lain untuk memilih. Gunakan bar bawah untuk isi, pindah, atau membuat picking list. Barang keluar dicatat melalui delivery note; draft mencadangkan jumlah tanpa mengurangi stok fisik; konfirmasi mengurangi jumlah dan menyimpan riwayat. Ketuk slot untuk memilih semua item; tekan Rinci pada bilah pilihan untuk memilih per item.</p><h3>3. Laporan WhatsApp</h3><p>Lihat pratinjau, pilih per ruangan atau semua, lalu salin, unduh TXT, atau buka WhatsApp. Pengiriman dilakukan oleh kamu di WhatsApp. PROD WIP kosong otomatis dihilangkan.</p><h3>${gas?'Google Sheets aktif':'Pratinjau lokal'}</h3><p>${gas?'Simpan mencatat transaksi di HP terlebih dahulu. Tekan SYNC atau SHARE TO WHATSAPP saat online untuk mengirim seluruh antrean. Antrean hanya dihapus setelah server mengonfirmasi. Jika ada konflik, data HP tetap disimpan; unduh Cadangan dan hubungi pengelola. Buka dan muat data mode saat online sebelum masuk area tanpa sinyal.':'Versi ini memakai penyimpanan browser, belum tersambung ke Google Sheets. Buka paket source untuk pemasangan Apps Script. Mode demo memiliki penyimpanan terpisah.'}</p><h3>Catatan denah</h3><p>Denah mengikuti lampiran, termasuk slot tidak lengkap. Exp CHILLER memakai tepat 180 hari.</p></div>`,btn('Mengerti','close-modal','primary'));}
async function showReport(){if(!S.session)return toast('Pilih area dan mulai shift terlebih dahulu.');if(gas&&navigator.onLine!==false&&!await syncOfflineData())return;S.editor=null;S.reportRoom='';openModal('Laporan WhatsApp',`${esc(S.mode)} · ${WMS.short(S.session.date)} · ${esc(S.session.shift)}`,`<div id="report-error"></div><div class="info">${gas&&(offlineCount()||navigator.onLine===false)?'PRATINJAU DATA HP — belum dikonfirmasi ke Google Sheets. ':''}Periksa laporan sebelum membagikan. Urutan lokasi mengikuti denah; WIP kosong tidak ditampilkan.</div><div class="report-tabs"><button class="btn small primary" data-action="report-room" data-room="">Semua</button>${rooms().map(r=>`<button class="btn small" data-action="report-room" data-room="${r}">${r.replace(' C',' ')}</button>`).join('')}</div><textarea readonly id="report-text" class="field report-text" aria-label="Teks laporan WhatsApp">Menyiapkan laporan…</textarea><div class="notice" id="report-length"></div>`,`${btn('TXT','download-report','','download')}<div class="row" style="gap:7px">${btn('Salin','copy-report','','copy')}${btn('WhatsApp','whatsapp','green','wa')}</div>`);await loadReport('');}
async function loadReport(room){const requestId=uid();S.reportRequest=requestId;S.reportReady=false;S.reportRoom=room;$$('[data-action="report-room"]').forEach(b=>b.classList.toggle('primary',b.dataset.room===room));$('#report-text').value='Menyiapkan laporan…';try{const text=WMS.report(S.data,S.session,room);if(S.reportRequest!==requestId||!$('#report-text'))return;S.reportText=text;S.reportReady=true;$('#report-text').value=text||'PROD WIP kosong — seksi ini tidak disertakan pada laporan.';$('#report-length').textContent=number(text.length)+' karakter · '+(text.length>6000?'Untuk laporan panjang, salin teks atau unduh TXT.':'Siap disalin atau dibagikan.');}catch(e){if($('#report-error'))$('#report-error').innerHTML=`<div class="error">${esc(errorText(e))}</div>`;}}
async function copyReport(){if(!S.reportReady||!S.reportText)return toast('Belum ada teks laporan untuk disalin.');try{await navigator.clipboard.writeText(S.reportText);toast('Laporan berhasil disalin.');}catch(e){const t=$('#report-text');t.focus();t.select();if(document.execCommand('copy'))toast('Laporan berhasil disalin.');else toast('Teks sudah dipilih. Tekan salin pada perangkatmu.');}}
function downloadReport(){if(!S.reportReady||!S.reportText)return toast('Belum ada laporan.');const url=URL.createObjectURL(new Blob([S.reportText],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`${S.mode}-${S.session.date}-${S.session.shift}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function start(form,demo=false){if(S.busy)return;S.busy=true;const button=form?.querySelector('button[type=submit]');if(button){button.disabled=true;button.innerHTML='<span class="loading"></span> Menyiapkan ruang kerja…';}try{const input=demo?{name:'Tim Gudang',date:today(),shift:'S1',mode:'CSFG'}:{...Object.fromEntries(new FormData(form)),mode:S.mode};if(demo){S.demo=true;S.mode='CSFG';}let result;if(gas)result=await cloudStart(input);else{const ss={...WMS.session(input),id:uid()};let data=localData();if(demo&&!data.stock.length){let r=0;for(const loc of data.locations.filter(l=>l.group==='CSFG'&&l.kind==='rack'&&['A','B','C'].includes(l.block)).slice(0,26)){if(r%5!==0){const raw={...freshDemo(r),spv:['JT','HW','AK'][r%3]};data.stock.push(WMS.item(raw,loc,data.skus,uid(),new Date(Date.now()-r*60000).toISOString(),ss.id));}r++;}}localStorage.setItem(storageKey(),JSON.stringify(data));result={session:ss,data};}S.session=result.session;S.data=result.data;S.mode=input.mode;rememberSession(true);Navigation.saved();S.busy=false;nav('dashboard');if(demo)toast('Mode demo aktif. Data contoh terpisah dari stok lokal.');}catch(e){const el=$('#session-error');if(el)el.innerHTML=`<div class="error">${esc(errorText(e))}</div>`;else toast(errorText(e));}finally{S.busy=false;if(button){button.disabled=false;button.innerHTML='START · Mulai shift '+icon('arrow',17);}}}

function storedOffline(mode=S.mode){return Offline.read(localStorage,offlineKey(mode));}
function storeOffline(state,previous,mode=S.mode){return Offline.write(localStorage,offlineKey(mode),state,previous?.revision??null);}

function connectionMarkup(){const offline=navigator.onLine===false||S.connection==='offline';return `<span class="pill ${offline?'amber':'green'} connection-pill" role="status"><i class="dot"></i>STATUS: ${offline?'OFFLINE (TERSIMPAN DI HP)':'ONLINE'}</span>`;}

function storageError(e){const target=$('#editor-error')||$('#action-error');if(target)target.innerHTML=`<div class="error">${esc(errorText(e))}</div>`;else toast(errorText(e));}
function call(name,...args){return new Promise((resolve,reject)=>{
  let settled=false;const timer=setTimeout(()=>{if(settled)return;settled=true;S.connection='offline';refreshConnection();reject(new Error('Koneksi belum merespons. Data tetap di HP; coba SYNC lagi saat sinyal kembali.'));},20000);
  const done=(fn,result)=>{if(settled)return;settled=true;clearTimeout(timer);S.connection='online';refreshConnection();fn(result);};
  try{google.script.run.withSuccessHandler(r=>done(resolve,r)).withFailureHandler(e=>{if(/network|connection|offline|fetch/i.test(errorText(e))){clearTimeout(timer);settled=true;S.connection='offline';refreshConnection();reject(e);}else done(reject,e);})[name](...args);}catch(e){clearTimeout(timer);settled=true;S.connection='offline';refreshConnection();reject(e);}
});}
async function cloudStart(input){
  let cached=storedOffline(input.mode),result=null;
  if(navigator.onLine!==false){try{result=await call('startSession',input);}catch(e){if(!cached)throw e;if(S.connection!=='offline')throw e;}}
  if(!result){WMS.assert(cached,'Buka mode ini saat online terlebih dahulu agar data rak tersimpan di HP.');return {session:{...WMS.session(input),id:uid(),offline:true},data:cached.data};}
  return deviceLock(input.mode,()=>{cached=storedOffline(input.mode);if(cached?.queue.length)return {...result,data:cached.data};const next={...Offline.initial(result.data),revision:(cached?.revision??-1)+1};storeOffline(next,cached,input.mode);return result;});
}

async function mutate(request){

  try{
    request.version=S.data.version;
    if(gas){await deviceLock(S.mode,()=>{const stored=storedOffline();WMS.assert(stored,'Data offline belum dimuat. Mulai sesi ketika online.');const next=Offline.enqueue(stored,request,S.session,uid,new Date().toISOString());storeOffline(next,stored);S.data=next.data;});}
    else {const before=localData(),at=new Date().toISOString(),next=Delivery.mutate(before,request,S.session,uid,at);next.transactions=(before.transactions||[]).concat(StockExport.capture(before,next,request,S.session,uid(),at));next.exportSessions=[...(before.exportSessions||[]).filter(s=>s.id!==S.session.id),S.session];localStorage.setItem(storageKey(),JSON.stringify(next));S.data=next;}

async function syncOfflineData(){
  if(!gas){toast('Pratinjau lokal: belum terhubung ke Google Sheets.');return true;}
  if(!S.session)return false;if(S.syncing||S.busy)return false;
  if(navigator.onLine===false){S.connection='offline';refreshConnection();toast('Tidak ada koneksi. Semua transaksi yang sudah disimpan tetap di HP.');return false;}
  if(S.excel)S.excel.result=null;S.syncing=true;S.busy=true;refreshConnection();let success=false;
  try{
    await deviceLock(S.mode,async()=>{
      let cached=storedOffline();WMS.assert(cached,'Cache belum tersedia. Mulai sesi saat online.');
      // Renew authentication without replacing the pending local snapshot.
      const fresh=await call('startSession',WMS.session(S.session));S.session=fresh.session;S.sessions[S.mode]=fresh.session;
      if(!cached.queue.length){const next={...Offline.initial(fresh.data),revision:cached.revision+1};storeOffline(next,cached);S.data=next.data;success=true;return;}
      while(cached.queue.length){
        const frozen=Offline.freeze(cached,uid);if(frozen!==cached){storeOffline(frozen,cached);cached=frozen;}
        const response=await call('syncOfflineBatch',S.session.id,cached.inflight);
        if(response.conflict){S.syncError=response.message;throw new Error(response.message);}
        // Never clear until the exact batch and every submitted transaction are acknowledged.
        const current=storedOffline(),next=Offline.acknowledge(current,response);
        storeOffline(next,current);cached=next;S.data=next.data;
      }
      S.syncError='';success=true;
    });
    toast('SYNC berhasil. Antrean terkirim ke Google Sheets.');
  }catch(e){S.syncError=errorText(e);toast(S.syncError+' Antrean tidak dihapus.');}
  finally{S.syncing=false;S.busy=false;rememberSession();render();}
  return success;
}

function inventoryItemMatches(i,loc){
  const f=S.productFilters||{},q=S.search.trim().toLowerCase();
  return (!q||`${loc.display} ${loc.room} ${i.sku} ${i.kp} ${WMS.short(i.kp)} ${i.qty} ${i.spv} ${i.palletNo||''} ${i.palletLabel||''} ${i.note}`.toLowerCase().includes(q))
    &&(!f.status||i.status===f.status)&&(!f.sku||i.sku===f.sku)&&(!f.kp||i.kp===f.kp)&&(!f.qty||i.qty===Number(f.qty))&&(!f.spv||i.spv===f.spv)
    &&(S.filter!=='Hold'||i.status==='Hold');
}
function inventoryLocationMatches(loc,items){
  if(S.filter==='empty'&&items.length)return false;
  if(S.filter==='filled'&&!items.length)return false;
  if(S.filter==='noncomm'&&loc.functionType===WMS.FUNCTIONS[0])return false;
  const f=S.productFilters||{},itemFilter=f.status||f.sku||f.kp||f.qty||f.spv||S.filter==='Hold';
  if(items.length)return items.some(i=>inventoryItemMatches(i,loc));
  return !itemFilter&&(!S.search.trim()||`${loc.display} ${loc.room}`.toLowerCase().includes(S.search.trim().toLowerCase()));
}

/* KP-based ordering only; sorting never selects or modifies stock. */
const Picking=(()=>{
  function candidates(data,mode,{sku='',query='',fefo=false}={}){
    const locations=new Map(data.locations.filter(l=>l.group===mode).map(l=>[l.id,l]));
    const q=query.trim().toLowerCase();
    const rows=data.stock.filter(i=>locations.has(i.locationId)&&i.qty>0&&(!sku||i.sku===sku)&&(!q||[i.sku,i.kp,WMS.short(i.kp),Pallets.label(i),i.palletNo,i.spv,i.status,i.note,locations.get(i.locationId).room,locations.get(i.locationId).display].join(' ').toLowerCase().includes(q)));
    return rows.sort((a,b)=>{
      const la=locations.get(a.locationId),lb=locations.get(b.locationId);
      return (fefo?(a.sku.localeCompare(b.sku)||(a.status==='Release'?0:1)-(b.status==='Release'?0:1)||a.kp.localeCompare(b.kp)):0)||la.room.localeCompare(lb.room)||la.order-lb.order||a.id.localeCompare(b.id);
    });
  }
  function summary(lines){const groups=new Map();for(const l of lines){const key=JSON.stringify([l.sku,l.kp,l.unit||'CTN']);if(!groups.has(key))groups.set(key,{sku:l.sku||'Stok tidak tersedia',kp:l.kp||'',unit:l.unit||'CTN',qty:0});groups.get(key).qty+=Number(l.qty)||0;}return [...groups.values()].sort((a,b)=>a.sku.localeCompare(b.sku)||a.kp.localeCompare(b.kp)||a.unit.localeCompare(b.unit));}
  function withPallets(lines){return summary(lines).map(g=>({...g,pallets:Pallets.count(lines.filter(l=>l.sku===g.sku&&l.kp===g.kp&&(l.unit||'CTN')===g.unit))}));}
  return {candidates,summary:withPallets};
})();

  if(!Navigation.allowLeave())return;closeModal();S.editor=null;if(!id&&!ids.length&&S.dnDraft?.mode===S.mode){renderDeliveryDraft();return;}S.dnDraft=d?JSON.parse(JSON.stringify(d)):{id:uid(),mode:S.mode,revision:0,date:S.session.date,shift:S.session.shift,truck:'',destination:'',note:'',lines:ids.map(itemId=>({itemId,qty:Delivery.availability(S.data,itemId).available})).filter(l=>l.qty>0)};if(!S.dnDraft.shift)S.dnDraft.shift=S.session.shift;S.pickSummaryOpen=true;S.dnDraftSearch='';S.dnProduct='';renderDeliveryDraft();
}
function capitalizeTruckInput(el){
 if(!el)return;const before=el.value,after=before.toUpperCase();if(before===after)return;
 const start=el.selectionStart,end=el.selectionEnd,direction=el.selectionDirection;el.value=after;
 if(typeof start==='number'&&typeof end==='number')el.setSelectionRange(before.slice(0,start).toUpperCase().length,before.slice(0,end).toUpperCase().length,direction||'none');
}
function readDeliveryDraft(){const d=S.dnDraft;if(!d)return;for(const k of ['date','shift','truck','destination','note'])if($('#dn-'+k)){const value=$('#dn-'+k).value;d[k]=k==='truck'?value.toUpperCase():value;}}

function deliveryPicker(){const selected=new Set(S.dnDraft.lines.map(l=>l.itemId)),index=new Map(locs(null).map(l=>[l.id,l])),reserved=Delivery.reservationIndex(S.data,S.dnDraft.id);
 const items=Picking.candidates(S.data,S.mode,{query:S.dnDraftSearch||'',sku:S.dnProduct||'',fefo:!!S.dnFefo});

// Validate the whole list before changing any rack; keep pallet IDs as strings.
function bulkPalletNumbers(value,count){
  const raw=String(value??'').trim();
  WMS.assert(Number.isInteger(count)&&count>0&&count<=100,'Pilih 1–100 rak terlebih dahulu.');
  if(raw.includes(',')){
    const values=raw.split(',').map(v=>v.trim());
    WMS.assert(values.every(v=>/^[0-9]{1,20}$/.test(v)),'Isi nomor pallet berupa angka, dipisahkan koma. Jangan sisakan nomor kosong.');
    WMS.assert(values.length===count,'Ada '+values.length+' nomor pallet untuk '+count+' rak. Jumlahnya harus sama.');
    return values.map(WMS.pallet);
  }
  WMS.assert(/^[0-9]{1,15}$/.test(raw),'Isi satu nomor awal, atau daftar nomor yang dipisahkan koma.');
  const start=Number(raw);WMS.assert(Number.isSafeInteger(start+count-1),'Nomor berurutan terlalu besar.');
  return Array.from({length:count},(_,n)=>String(start+n));
}

/* Shift identity survives navigation/reload, independently of short-lived server tokens. */
const SessionMemory=(()=>{
  const duration=12*60*60*1000;
  function read(storage,key,now=Date.now()){
    let record;try{record=JSON.parse(storage.getItem(key)||'null');}catch{return null;}
    if(!record||record.schema!==1||!Number.isFinite(record.until)||record.until<=now||record.until>now+duration)return null;
    try{WMS.session({...record.identity,mode:record.mode||'CSFG'});}catch{return null;}
    return record;
  }
  function create(session,now=Date.now()){return {schema:1,until:now+duration,identity:{name:session.name,date:session.date,shift:session.shift},mode:session.mode,sessions:{[session.mode]:session},rooms:{}};}
  function write(storage,key,record){storage.setItem(key,JSON.stringify(record));return record;}
  return {read,create,write,duration};
})();

const shiftKey=()=> 'coldstock.shift.v1.'+(gas?(window.COLDSTOCK_DB||'unconfigured'):storageKey());
function restoreShift(){S.shiftMemory=SessionMemory.read(localStorage,shiftKey());if(S.shiftMemory){S.sessions=S.shiftMemory.sessions||{};S.lastRooms=S.shiftMemory.rooms||{};}else {S.sessions={};S.lastRooms={};}}
function rememberSession(fresh=false){if(!S.session)return;if(!fresh&&S.shiftMemory&&S.shiftMemory.until<=Date.now())return;try{let record=fresh?null:SessionMemory.read(localStorage,shiftKey());if(!record||JSON.stringify(record.identity)!==JSON.stringify({name:S.session.name,date:S.session.date,shift:S.session.shift}))record=SessionMemory.create(S.session);record.mode=S.mode;record.sessions[S.mode]=S.session;record.rooms={...(record.rooms||{}),...(S.lastRooms||{})};S.shiftMemory=SessionMemory.write(localStorage,shiftKey(),record);}catch{if(!S.sessionStorageWarned){S.sessionStorageWarned=true;toast('Sesi belum bisa diingat di HP. Periksa izin penyimpanan browser.');}}}
async function chooseMode(mode,route){
  if(S.busy)return false;if(!Navigation.allowLeave())return false;
  if(S.session)rememberSession();const record=SessionMemory.read(localStorage,shiftKey());S.mode=mode;S.search='';S.filter='all';S.productFilters={};S.selecting=false;S.rackSelection=false;S.selected.clear();
  if(!record){S.session=null;S.sessions={};nav('setup');return false;}
  S.busy=true;try{S.sessions=record.sessions||{};S.lastRooms=record.rooms||{};S.session=S.sessions[mode]||null;let data;
    if(S.session)data=gas?await cloudData():localData();
    else {const input={...record.identity,mode};const result=gas?await cloudStart(input):{session:{...WMS.session(input),id:uid()},data:localData()};S.session=result.session;data=result.data;}
    S.data=data;S.room=S.lastRooms[mode]||rooms()[0];S.sessions[mode]=S.session;rememberSession();S.busy=false;
    if(route)Navigation.apply(route);else nav('dashboard');return true;
  }catch(e){S.session=null;toast(errorText(e));S.busy=false;nav('entry');return false;}finally{S.busy=false;}
}
function bayHome(){if(!S.session)return nav('entry');S.room=S.lastRooms?.[S.mode]||S.room||rooms()[0];if(!rooms().includes(S.room))S.room=rooms()[0];nav('storage');}
function workNavigation(){return `<div class="work-navigation">${btn('Kembali','app-back','','back')}${btn('Stok / Bay','bay-home','','warehouse')}${btn('Home','home','','home')}</div>`;}

const Navigation=(()=>{
  let initialized=false,modal=false,applying=false;
  const route=()=>({coldstock:1,page:S.page,mode:S.mode,room:S.room,documentId:S.dnViewing||null,kind:S.documentKind||'picking',scroll:window.scrollY||0});
  function write(method,state){if(!initialized||applying)return;try{if(gas&&google.script.history)google.script.history[method](state,null,'coldstock-'+state.page);else history[method==='push'?'pushState':'replaceState'](state,'','#coldstock-'+state.page);}catch{/* Visible back controls continue to work if browser history is unavailable. */}}
  function allowLeave(){if(!S.formDirty)return true;if(typeof window.confirm==='function'&&!window.confirm('Ada isian belum disimpan. Tinggalkan form ini?'))return false;S.formDirty=false;return true;}
  function saved(){S.formDirty=false;}
  function go(page){if(S.busy)return false;if(page!==S.page&&!allowLeave())return false;
    if(S.page==='storage'){if(!S.lastRooms)S.lastRooms={};S.lastRooms[S.mode]=S.room;rememberSession();}
    const previous=S.page;S.page=page;S.selected.clear();S.selecting=false;S.bulkSelecting=false;S.rackSelection=false;S.rackSelected=new Set();modal=false;
    if(page==='storage'){if(!S.lastRooms)S.lastRooms={};S.lastRooms[S.mode]=S.room;rememberSession();}
    render();window.scrollTo({top:0,behavior:'instant'});write(previous==='setup'&&page==='dashboard'?'replace':'push',route());return true;
  }
  // Dialogs are UI state, not extra page entries. Back closes one and restores
  // the current page so the next Back still reaches its original parent.
  function modalOpened(){modal=true;}
  function modalClosed(){modal=false;}
  function apply(r){
    if(!r||r.coldstock!==1)return go('entry');
    const pages=['entry','setup','dashboard','exports','storage','picklists','delivery','picking','deliveryDetail','bulkInput','movement'];let page=pages.includes(r.page)?r.page:'entry';
    if(!S.session&&!['entry','setup'].includes(page))page='entry';
    if(page==='picking'&&!S.dnDraft)page='picklists';if(page==='bulkInput'&&!S.bulkDraft)page='storage';
    if(page==='movement'&&!S.moveDraft)page='storage';
    if(page==='setup'&&S.session)page='dashboard';
    applying=true;S.page=page;if(r.room&&S.session&&rooms().includes(r.room))S.room=r.room;S.dnViewing=r.documentId;S.documentKind=r.kind||'picking';S.rackSelection=false;S.selected.clear();S.selecting=false;S.bulkSelecting=false;modal=false;render();window.scrollTo({top:r.scroll||0,behavior:'instant'});applying=false;
  }
  async function changed(r){
    if(S.busy){write('push',{...route(),modal});return;}
    if($('#modal')?.open){if(S.editor&&!allowLeave()){write('push',route());return;}$('#modal').close();S.editor=null;modal=false;write('push',route());return;}
    if(S.page==='movement'&&S.moveDraft?.picking!==null){S.moveDraft.picking=null;showMovePage();write('push',route());return;}
    if(S.rackSelection){cancelRackSelection();write('push',route());return;}
    if(!allowLeave()){write('push',route());return;}
    if(r?.mode&&S.mode!==r.mode&&S.session){await chooseMode(r.mode,r);return;}
    apply(r||{coldstock:1,page:'entry'});
  }
  function back(){if(S.page==='movement'){if(S.moveDraft?.picking!==null){S.moveDraft.picking=null;showMovePage();return;}return leaveMove();}if($('#modal')?.open)return closeModal();if(S.rackSelection)return cancelRackSelection();const parent={exports:'dashboard',storage:'dashboard',picking:'picklists',deliveryDetail:S.documentKind==='delivery'?'delivery':'picklists',delivery:'picklists',picklists:'dashboard',bulkInput:'storage',dashboard:'entry',setup:'entry',entry:'entry'};go(parent[S.page]||'entry');}
  function init(){initialized=true;if(gas&&google.script.history)google.script.history.setChangeHandler(e=>changed(e.state));else window.addEventListener('popstate',e=>changed(e.state));write('replace',route());}
  return {init,go,back,allowLeave,saved,modalOpened,modalClosed,apply,changed};
})();
document.addEventListener('input',e=>{if(S.editor||S.page==='bulkInput'&&e.target.closest('.workflow-panel')||S.page==='picking'&&(['dn-date','dn-truck','dn-shift','dn-destination','dn-note'].includes(e.target.id)||e.target.dataset.dnQty))S.formDirty=true;});
document.addEventListener('change',e=>{if(S.editor||S.page==='bulkInput'&&e.target.closest('.workflow-panel')||e.target.dataset.dnItem)S.formDirty=true;});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||S.busy)return;if(['mode','entry','home','storage','room','bay-home','pl-home','dn-home','dn-view','pl-view','new-shift'].includes(b.dataset.action)&&!Navigation.allowLeave()){e.preventDefault();e.stopImmediatePropagation();}},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||S.busy)return;if(b.dataset.action==='app-back')Navigation.back();if(b.dataset.action==='bay-home')bayHome();if(b.dataset.action==='new-shift'){if(!Navigation.allowLeave())return;try{localStorage.removeItem(shiftKey());}catch{toast('Tidak dapat mengganti sesi. Periksa penyimpanan HP.');return;}S.sessions={};S.session=null;S.shiftMemory=null;S.dnDraft=null;S.bulkDraft=null;S.mode=S.mode||'CSFG';nav('setup');}});
window.addEventListener('beforeunload',e=>{if(S.formDirty){e.preventDefault();e.returnValue='';}});

// Selection only changes decoration: never replace Bay nodes or disturb scroll/focus.
function updateSelectionUI(){
 const index=new Map();for(const i of modeStock()){if(!index.has(i.locationId))index.set(i.locationId,[]);index.get(i.locationId).push(i);}
 $$('#rack-content [data-action="slot"]').forEach(el=>{
  const id=el.dataset.id,items=index.get(id)||[];
  const chosen=S.rackSelection?!!S.rackSelected?.has(id):S.bulkSelecting?!!S.emptySelected?.has(id):!!items.length&&items.every(i=>S.selected.has(i.id));
  el.classList.toggle('selected',chosen);
  if(S.rackSelection||S.selecting||S.bulkSelecting)el.setAttribute('aria-pressed',String(chosen));else el.removeAttribute('aria-pressed');
  const mark=el.querySelector('[data-rack-mark]'),state=chosen?'check':items.length?'':'plus';
  if(mark&&mark.dataset.rackMark!==state){mark.dataset.rackMark=state;mark.innerHTML=state?icon(state,12):'';}
 });
 const bar=$('#selection-container');if(bar)bar.innerHTML=selectionBar();
 const toggle=$('[data-action="rack-select-toggle"]');if(toggle){toggle.textContent=S.rackSelection?'Batal pilih':'Pilih rak';toggle.setAttribute('aria-label',toggle.textContent);}
}
function inventoryFilterCount(){return Object.values(S.productFilters||{}).filter(Boolean).length+(S.search.trim()?1:0)+(S.filter!=='all'?1:0);}
function openInventorySearch(){const f=S.productFilters||{};openModal('Cari / Filter','Terapkan untuk menyaring rak. Navigasi alfabet tetap tersedia.',`<label class="label">Cari stok<input id="inv-query" class="field" value="${esc(S.search)}" placeholder="Produk, lokasi, KP, atau pallet"></label><div class="two-col"><label class="label">Isi rak<select class="field" id="inv-occupancy">${[['all','Semua rak'],['filled','Terisi'],['empty','Kosong'],['noncomm','Non-komersial']].map(([v,l])=>`<option value="${v}" ${v===S.filter?'selected':''}>${l}</option>`).join('')}</select></label><label class="label">Status<select class="field" data-inv-filter="status" aria-label="Filter status"><option value="">Semua status</option>${opts(WMS.STATUS,f.status)}</select></label><label class="label">Produk<select class="field" data-inv-filter="sku" aria-label="Filter produk"><option value="">Semua produk</option>${opts(S.data.skus.filter(s=>s.group===S.mode).map(s=>s.code),f.sku)}</select></label><label class="label">KP<input type="date" class="field" data-inv-filter="kp" aria-label="Filter KP" value="${esc(f.kp||'')}"></label><label class="label">Jumlah tepat<input type="number" min="1" step="1" inputmode="numeric" class="field" data-inv-filter="qty" aria-label="Filter jumlah" value="${esc(f.qty||'')}" placeholder="Semua jumlah"></label>${S.mode==='CSFG'?`<label class="label">Kode SPV<select class="field" data-inv-filter="spv" aria-label="Filter SPV"><option value="">Semua SPV</option>${opts(['JT','HW','AK','-'],f.spv)}</select></label>`:''}</div>`,`${btn('Reset','filter-clear')}${btn('Terapkan','filter-apply','primary','check')}`);}
function cancelRackSelection(){S.rackSelection=false;S.rackSelected=new Set();S.selected.clear();S.selecting=false;S.bulkSelecting=false;updateSelectionUI();const toggle=$('[data-action="rack-select-toggle"]');if(toggle){toggle.textContent='Pilih rak';toggle.setAttribute('aria-label','Pilih rak');}}
function toggleRack(id){const loc=locs().find(l=>l.id===id&&l.kind==='rack');if(!loc)return;S.rackSelection=true;if(!S.rackSelected)S.rackSelected=new Set();if(S.rackSelected.has(id)){S.rackSelected.delete(id);stockAt(id).forEach(i=>S.selected.delete(i.id));}else {if(S.rackSelected.size>=100)return toast('Maksimal 100 rak dipilih.');S.rackSelected.add(id);stockAt(id).forEach(i=>S.selected.add(i.id));}S.selecting=true;updateSelectionUI();const toggle=$('[data-action="rack-select-toggle"]');if(toggle){toggle.textContent='Batal pilih';toggle.setAttribute('aria-label','Batal pilih');}}
function rackActionBar(){const ids=[...(S.rackSelected||[])],empty=ids.filter(id=>!stockAt(id).length).length;return `<div class="rack-action-bar"><div class="row between"><strong>${ids.length} rak · ${empty} kosong · ${ids.length-empty} terisi</strong>${btn('Batal','rack-cancel','small','close')}</div><div class="rack-actions">${btn('Isi ('+empty+')','rack-fill','small','plus',empty?'':'disabled')}${btn('Move ('+S.selected.size+')','rack-move','small','move',S.selected.size?'':'disabled')}${btn('Barang keluar','rack-out','small','truck',S.selected.size?'':'disabled')}${S.selected.size?btn('Rinci item','select-details','small'):''}</div></div>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||S.busy)return;switch(b.dataset.action){case 'inventory-search':openInventorySearch();break;case 'filter-apply':S.search=$('#inv-query').value;S.filter=$('#inv-occupancy').value;S.productFilters={};$$('[data-inv-filter]').forEach(el=>S.productFilters[el.dataset.invFilter]=el.value);closeModal();render();break;case 'filter-clear':S.search='';S.filter='all';S.productFilters={};closeModal();render();break;case 'rack-select-toggle':if(S.rackSelection)cancelRackSelection();else {S.rackSelection=true;S.rackSelected=new Set();S.selected.clear();S.selecting=true;updateSelectionUI();}break;case 'rack-cancel':cancelRackSelection();break;case 'rack-fill':S.emptySelected=new Set([...(S.rackSelected||[])].filter(id=>!stockAt(id).length));openBulkInput();break;case 'rack-move':moveModal([...S.selected]);break;case 'rack-out':if(S.selected.size>100)return toast('Maksimal 100 item per picking list. Gunakan Rinci item untuk memilih.');openDeliveryDraft(null,[...S.selected]);break;}});
// Cancel a pending hold as soon as scrolling/dragging begins. A completed hold consumes its click.
(()=>{let pending=null,suppressed=null;function cancel(){if(pending)clearTimeout(pending.timer);pending=null;}
 document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-action="slot"]');if(!b||S.busy||e.button!==0)return;cancel();const id=b.dataset.id;pending={x:e.clientX,y:e.clientY,id,pointer:e.pointerId,timer:setTimeout(()=>{pending=null;suppressed={id,until:Date.now()+1200};toggleRack(id);},500)};});
 document.addEventListener('pointermove',e=>{if(pending&&(Math.abs(e.clientX-pending.x)>10||Math.abs(e.clientY-pending.y)>10))cancel();},{passive:true});
 document.addEventListener('pointerup',cancel);document.addEventListener('pointercancel',cancel);document.addEventListener('scroll',cancel,true);
 document.addEventListener('click',e=>{const b=e.target.closest('[data-action="slot"]');if(b&&suppressed&&suppressed.id===b.dataset.id&&Date.now()<suppressed.until){suppressed=null;e.preventDefault();e.stopImmediatePropagation();}},true);
 document.addEventListener('contextmenu',e=>{const b=e.target.closest('[data-action="slot"]');if(b){e.preventDefault();if(!S.rackSelection&&!pending)toggleRack(b.dataset.id);}});
 document.addEventListener('keydown',e=>{const b=e.target.closest('[data-action="slot"]');if(b&&e.key===' '&&e.shiftKey){e.preventDefault();toggleRack(b.dataset.id);}});
})();

function picklistsView(){
 const f=S.pickListFilters||{date:S.session.date,shift:S.session.shift},q=(f.query||'').toLowerCase();
 const docs=(S.data.deliveryNotes||[]).filter(d=>d.mode===S.mode&&(!f.date||d.date===f.date)&&(!f.shift||d.shift===f.shift)&&(!q||[d.truck,d.destination,d.sjNumber,pickingNumber(d),d.createdName].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
 return `${sessionBar()}${workNavigation()}<div class="intro-line"><div><span class="eyebrow">SATU PICKING LIST PER TRUK</span><h1>Picking List</h1><p class="sub">Setelah muat selesai dan SJ tersedia, periksa rincian lalu konfirmasi barang keluar.</p></div>${btn('Buat picking list','dn-new','primary','plus')}</div><div class="picking-list-filters"><label>Tanggal<input type="date" class="field" id="pl-date" value="${esc(f.date||'')}"></label><label>Shift<select class="field" id="pl-shift"><option value="">Semua shift</option>${opts(['S1','S2','S3'],f.shift)}</select></label><label>Cari truk / tujuan<input class="field" id="pl-query" value="${esc(f.query||'')}" placeholder="Nomor polisi atau tujuan"></label>${btn('Tampilkan','pl-filter')}${btn('Semua tanggal / shift','pl-all','small')}</div><div class="inventory-actions">${btn('Riwayat Surat Jalan','dn-home','','truck')}${btn('Muat ulang','refresh','','refresh')}</div>${(S.data.deliveryNotes||[]).some(d=>d.mode===S.mode&&!d.shift)?'<p class="notice">Dokumen lama tanpa shift tersedia melalui Semua tanggal / shift.</p>':''}<div class="dn-list">${docs.map(d=>`<article class="panel dn-card"><div class="row between wrap"><strong>${esc(pickingNumber(d))}</strong><span class="pill ${d.state==='ISSUED'?'green':d.state==='CANCELLED'?'gray':'amber'}">${d.state==='ISSUED'?'Barang keluar':deliveryLabel(d.state)}</span></div><h2>${esc(d.truck||'Truk belum dicatat')}</h2><p class="dn-card-info">${esc(d.date)} · ${esc(d.shift||'Shift belum dicatat')} · ${esc(d.destination)}</p><p class="dn-card-info">${deliveryTotal(d)} · ${d.lines.length} item · SK ${esc(d.createdName)}</p>${deliveryPending(d.id)?'<p class="dn-pending">Tersimpan di HP · Menunggu SYNC</p>':''}<div class="dn-card-actions">${btn('Lihat picking list','pl-view','','report',`data-id="${esc(d.id)}"`)}${d.state==='DRAFT'?btn('Konfirmasi keluar','pl-complete','primary','truck',`data-id="${esc(d.id)}"`):d.state==='ISSUED'?btn('Lihat SJ','dn-view','','truck',`data-id="${esc(d.id)}"`):''}</div></article>`).join('')||'<div class="empty"><h3>Belum ada picking list untuk pilihan ini</h3><p>Buat picking list per truk, atau pilih tanggal/shift lain.</p></div>'}</div>`;

function deliveryView(){const docs=(S.data.deliveryNotes||[]).filter(d=>d.mode===S.mode&&d.state==='ISSUED').sort((a,b)=>b.confirmedAt.localeCompare(a.confirmedAt));return `${sessionBar()}${workNavigation()}<div class="intro-line"><div><span class="eyebrow">RIWAYAT BARANG KELUAR</span><h1>Surat Jalan</h1><p class="sub">Dokumen dari picking list yang sudah dikonfirmasi keluar.</p></div>${btn('Picking List','pl-home','','back')}</div><div class="dn-list">${docs.map(d=>`<button class="panel dn-card" data-action="dn-view" data-id="${esc(d.id)}"><strong>${esc(d.sjNumber||'SJ belum tercatat · '+d.number)}</strong><span>${esc(d.truck||d.destination)} · ${deliveryTotal(d)}</span><span class="dn-card-info">${esc(d.date)} · ${esc(d.shift||'Shift belum dicatat')} · ${esc(pickingNumber(d))}</span>${deliveryPending(d.id)?'<span class="dn-pending">Tersimpan di HP · Menunggu SYNC</span>':''}</button>`).join('')||'<div class="empty"><h3>Belum ada surat jalan</h3><p>Konfirmasi barang keluar dari Picking List untuk mencatat pengeluaran.</p></div>'}</div>`;}
function selectedLines(){const reserved=Delivery.reservationIndex(S.data,S.dnDraft.id);return S.dnDraft.lines.map(l=>{const i=S.data.stock.find(i=>i.id===l.itemId),loc=i&&S.data.locations.find(x=>x.id===i.locationId);return {...l,...(i||{}),itemId:l.itemId,qty:l.qty,room:loc?.room||l.room||'',location:loc?.display||l.location||'',available:i?Delivery.availability(S.data,i.id,S.dnDraft.id,reserved).available:undefined,unit:i?.unit||l.unit||'CTN'};});}

function documentTable(lines,editable=false){return `<div class="document-table-wrap"><table class="document-table"><thead><tr><th>Produk / lokasi</th><th>KP</th><th>Pallet / SPV</th><th>Status</th><th>Jumlah</th>${editable?'<th>Aksi</th>':''}</tr></thead><tbody>${lines.map(l=>`<tr><td data-label="Produk / lokasi"><strong>${esc(l.sku||'Tidak tersedia')}</strong><small>${esc(l.room)} / ${esc(l.location)}</small>${l.note?'<small>'+esc(l.note)+'</small>':''}</td><td data-label="KP">${kpMarkup(l.kp)}</td><td data-label="Pallet / SPV">${esc(Pallets.label(l)||'—')+(l.palletId?'<small>Asal P '+esc(l.palletNo)+'</small>':'')}<small>${l.spv?'SPV '+esc(l.spv):''}</small></td><td data-label="Status">${esc(l.status||'—')}</td><td data-label="Jumlah">${editable?`<label class="dn-quantity">${esc(l.unit)}<input class="field" type="number" min="1" max="${l.available||0}" step="1" inputmode="numeric" data-dn-qty="${esc(l.itemId)}" aria-label="Jumlah ambil ${esc(l.sku)} ${esc(l.room)} ${esc(l.location)}" value="${esc(l.qty)}" ${l.available===undefined?'disabled':''}></label><small>${l.available===undefined?'Stok tidak tersedia':'Tersedia '+l.available}</small>`:`<strong>${number(l.qty)} ${esc(l.unit)}</strong>`}</td>${editable?`<td data-label="Aksi">${btn('Hapus pilihan','dn-remove','small','',`data-id="${esc(l.itemId)}"`)}</td>`:''}</tr>`).join('')}</tbody></table></div>`;}
function pickedList(){const lines=selectedLines();return lines.length?documentTable(lines,true):'<div class="empty"><h3>Belum ada pilihan</h3><p>Centang barang dari daftar stok.</p></div>';}
function deliveryDetailView(){const d=Delivery.find(S.data,S.dnViewing);if(!d)return `<div class="empty">Dokumen tidak tersedia.${btn('Picking List','pl-home')}</div>`;const pick=S.documentKind!=='delivery';return `${sessionBar()}${workNavigation()}<div class="intro-line"><div><span class="eyebrow">${deliveryLabel(d.state).toUpperCase()}</span><h1>${pick?'Picking List':'Surat Jalan'}</h1><p class="sub">${esc(pick?pickingNumber(d):(d.sjNumber||'SJ belum tercatat · '+d.number))}</p></div>${btn('Daftar Picking List','pl-home','','back')}</div>${deliveryPending(d.id)?'<p class="info">Tersimpan di HP · Menunggu SYNC.</p>':''}<div id="action-error"></div><section class="panel workflow-panel"><h2>${esc(d.truck||'Truk belum dicatat')}</h2><p>${esc(d.destination)} · ${esc(d.date)} · ${esc(d.shift||'Shift belum dicatat')}</p><p class="notice">SK ${esc(d.createdName)}${d.note?' · '+esc(d.note):''}</p>${!pick?'<p class="notice">Dari '+esc(pickingNumber(d))+' · Dikonfirmasi '+esc(d.confirmedName)+'</p>':''}${d.state==='DRAFT'?'<p class="notice">Jumlah sudah dicadangkan untuk picking ini. Stok fisik belum berkurang. Lengkapi No. SJ SAP dan konfirmasi barang keluar sekali setelah muatan sesuai.</p>':''}${documentTable(d.lines)}<div class="document-summary">${groupedSummary(d.lines)}<strong>Total: ${deliveryTotal(d)}</strong></div></section><div class="inventory-actions">${btn('Salin WA','dn-copy','','wa')}${btn('TXT','dn-download','','download')}${btn('Cetak tabel','dn-print','','report')}${pick&&d.state==='DRAFT'?btn('Edit','dn-edit')+btn('Batalkan picking','dn-cancel','danger'):''}</div><details class="panel workflow-panel"><summary>Teks WhatsApp</summary><textarea class="field report-text" id="dn-text" aria-label="Isi dokumen" readonly>${esc(documentText(d))}</textarea></details>${pick?`<div class="workflow-save"><strong>${deliveryTotal(d)}</strong>${d.state==='DRAFT'?btn('Konfirmasi keluar','dn-issue','primary','truck'):d.state==='ISSUED'?btn('Lihat SJ','dn-view','primary','truck',`data-id="${esc(d.id)}"`):'<span>Dibatalkan</span>'}</div>`:''}`;}
function documentText(d){return Delivery.text(d,S.documentKind==='delivery'?undefined:'picking');}
function deliveryConfirm(action){const d=Delivery.find(S.data,S.dnViewing);if(!d||d.state!=='DRAFT')return;S.dnConfirm={id:d.id,revision:d.revision,action};const issue=action==='issueDelivery';openModal(issue?'Konfirmasi barang keluar':'Batalkan picking list?',esc(pickingNumber(d)),`<div id="action-error" role="alert"></div><h3>${esc(d.truck||'Truk belum dicatat')}</h3><p>Tujuan: ${esc(d.destination)}</p><p class="sub">${issue?'Pastikan muatan sesuai dan surat jalan SAP sudah diterbitkan. Stok berkurang sekali setelah konfirmasi ini.':'Picking list dibatalkan; stok tidak berkurang.'}</p>${issue?'<label class="label" for="dn-sj">No. Surat Jalan (SJ) SAP <span class="required">*</span></label><input id="dn-sj" class="field" type="text" maxlength="80" autocomplete="off" spellcheck="false" required placeholder="Nomor SJ dari admin, termasuk nol di depan"><p class="notice">Masukkan nomor dari SAP; aplikasi tidak menerbitkan nomor SJ.</p>':''}<div class="document-summary">${groupedSummary(d.lines)}<strong>Total: ${deliveryTotal(d)}</strong></div>${issue&&d.lines.some(l=>l.status!=='Release')?'<p class="info">Ada barang selain Release. Periksa status dan izin pengeluarannya.</p>':''}<p class="notice">${gas?'Konfirmasi disimpan di HP. SYNC saat online.':''}</p>`,`${btn('Kembali','close-modal')}${btn(issue?'Konfirmasi Barang Keluar':'Ya, batalkan picking','dn-confirm',issue?'primary':'danger','check')}`);}
function printDelivery(){const d=Delivery.find(S.data,S.dnViewing);if(!d)return;const w=window.open('','_blank');if(!w)return toast('Jendela cetak diblokir. Gunakan Salin WA atau TXT.');w.document.write('<!doctype html><html lang="id"><head><title>'+esc(S.documentKind==='delivery'?(d.sjNumber||d.number):pickingNumber(d))+'</title><style>body{font:12px Arial;padding:18px}table{width:100%;border-collapse:collapse;margin:20px 0}th,td{border:1px solid #bbb;text-align:left;padding:8px;vertical-align:top}small{display:block;margin-top:4px}.pick-group{display:flex;justify-content:space-between;gap:30px;margin:8px 0}@media print{button{display:none}}</style></head><body><button onclick="window.print()">Cetak / Simpan PDF</button><h1>'+esc(S.documentKind==='delivery'?'Surat Jalan':'Picking List')+'</h1><p>'+esc(S.documentKind==='delivery'?'No. SJ: '+(d.sjNumber||'Belum tercatat (dokumen lama)'):pickingNumber(d))+'</p>'+(S.documentKind==='delivery'?'<p>Catatan Coldstock · Referensi internal: '+esc(d.number)+'</p>':'')+'<p>'+esc([d.truck,d.date,d.shift,d.destination].filter(Boolean).join(' · '))+'</p><p>'+esc(deliveryLabel(d.state))+'</p>'+documentTable(d.lines)+groupedSummary(d.lines)+'<p>Total: '+esc(deliveryTotal(d))+'</p><p>'+esc(d.note||'')+'</p>'+(deliveryPending(d.id)?'<p>TERSIMPAN DI HP — BELUM SYNC</p>':'')+'</body></html>');w.document.close();w.opener=null;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||S.busy)return;switch(b.dataset.action){case 'pl-home':if(S.session)nav('picklists');else toast('Mulai sesi terlebih dahulu.');break;case 'pl-filter':S.pickListFilters={date:$('#pl-date').value,shift:$('#pl-shift').value,query:$('#pl-query').value};render();break;case 'pl-all':S.pickListFilters={date:'',shift:'',query:''};render();break;case 'pl-view':viewDelivery(b.dataset.id,'picking');break;case 'pl-complete':S.dnViewing=b.dataset.id;deliveryConfirm('issueDelivery');break;case 'pick-summary-toggle':S.pickSummaryOpen=S.pickSummaryOpen===false;updatePickSummary();break;}});


/* Each whole stock item gets one empty rack; confirmation commits every pair together. */
function kpMarkup(kp){return kp?`<time datetime="${esc(kp)}" title="KP ${esc(kp.split('-').reverse().join('.'))}">${esc(WMS.short(kp))}</time>`:'—';}
function moveModal(ids){
 if(!ids.length)return toast('Pilih item yang akan dipindahkan.');
 if(ids.length>100)return toast('Maksimal 100 item per perpindahan. Gunakan Rinci item untuk memilih.');
 if(!Navigation.allowLeave())return;
 if(ids.some(id=>!S.data.stock.some(i=>i.id===id)))return toast('Stok berubah. Pilih ulang barang.');const rows=Pallets.expand(S.data,[...new Set(ids)]);if(rows.length>100)return toast('Gabungan pilihan melebihi 100 komponen. Kurangi pilihan.');
 if(rows.some(i=>!i))return toast('Stok berubah. Muat ulang sebelum memilih ulang.');
 const scroll=window.scrollY||0,room=S.room;
 closeModal();S.moveDraft={merge:false,rows:rows.map(i=>({item:Offline.clone(i),from:i.locationId,destination:''})),expected:{},room,scroll,picking:null,pickerRoom:room,pickerBlock:''};
 for(const r of S.moveDraft.rows)S.moveDraft.expected[r.from]=Offline.fingerprint(S.data,r.from);
 nav('movement');
}
function moveLabel(id){const l=S.data.locations.find(l=>l.id===id);return l?l.room+' / '+l.display:'Belum dipilih';}
function moveItemMarkup(row){const i=row.item;return `<strong>${esc(i.sku)} · ${number(i.qty)} ${esc(i.unit)}</strong><span>KP ${kpMarkup(i.kp)} · Pallet ${esc(Pallets.label(i)||'—')+(i.palletId?' · Asal P '+esc(i.palletNo):'')}${i.spv?' · SPV '+esc(i.spv):''}</span><span>${esc(i.status)} · Dari ${esc(moveLabel(row.from))}</span>`;}
function movementView(){const d=S.moveDraft;if(!d)return '<div class="empty">Tidak ada barang dipilih.</div>';return `<div class="move-workspace"><div class="work-navigation">${btn('Kembali ke Bay','move-exit','','back')}</div><div class="intro-line"><div><span class="eyebrow">PINDAH BARANG</span><h1>Pindahkan barang</h1><p class="sub">${d.merge?'Gabungkan produk dan KP yang sama ke satu pallet fisik. Jumlah per nomor asal tetap tercatat.':'Satu pallet fisik ke satu rak kosong. Pallet gabungan dipindahkan utuh.'}</p></div></div><div class="merge-choice">${btn('Pindah biasa','move-normal',!d.merge?'primary':'')}${btn('Gabungkan ke 1 pallet','move-merge',d.merge?'primary':'')}</div><div id="action-error"></div>${d.picking!==null?movePickerMarkup():moveSummaryMarkup()}</div>`;}
function moveSummaryMarkup(){const d=S.moveDraft,count=d.rows.filter(r=>r.destination).length;return `${d.merge?mergePreview():''}<div class="move-summary">${d.rows.map((r,n)=>`<article class="panel move-pair"><div class="move-item">${moveItemMarkup(r)}</div><div class="move-pair-target"><span>Tujuan</span><strong>${esc(moveLabel(r.destination))}</strong></div><div class="row wrap">${btn(r.destination?'Ganti tujuan':'Pilih tujuan','move-choose',r.destination?'':'primary','warehouse',`data-index="${n}"`)}${btn('Keluarkan dari pilihan','move-remove','small','',`data-index="${n}"`)}</div></article>`).join('')}</div><div class="workflow-save move-save"><strong>${d.merge?(count?'1':'0')+'/1 tujuan gabungan dipilih':count+'/'+d.rows.length+' tujuan dipilih'}</strong>${btn(d.merge?'Konfirmasi gabungan':'Konfirmasi pindah','move-save','primary','move',count===d.rows.length&&count?'':'disabled')}</div>`;}
function movePickerRooms(){return [...new Set(locs(null).filter(l=>l.kind==='rack').map(l=>l.room))];}
function movePickerMarkup(){const d=S.moveDraft,rs=movePickerRooms();if(!rs.includes(d.pickerRoom))d.pickerRoom=rs[0];const ls=locs(null).filter(l=>l.kind==='rack'&&l.room===d.pickerRoom),blocks=[...new Set(ls.map(l=>l.block))];if(!blocks.includes(d.pickerBlock))d.pickerBlock=blocks[0];
 return `<div class="move-picker-head"><div id="move-active" class="panel move-active" aria-live="polite">${moveActiveMarkup()}</div><label class="label">Ruangan tujuan<select class="field" id="move-picker-room">${opts(rs,d.pickerRoom)}</select></label><nav class="block-tabs" aria-label="Blok rak tujuan">${blocks.map(b=>`<button class="block-tab ${b===d.pickerBlock?'active':''}" data-action="move-block" data-block="${esc(b)}">${esc(b)}</button>`).join('')}</nav></div><p class="notice">${d.merge?'Pilih rak kosong atau rak asal yang seluruh isinya ikut digabung. Semua komponen akan ditumpuk di satu pallet.':'Tap rak kosong untuk memasangkan. Satu pallet gabungan dipindahkan utuh ke satu tujuan.'}</p><div class="bay-grid move-grid">${[...new Set(ls.filter(l=>l.block===d.pickerBlock).map(l=>l.bay))].map(bay=>`<section class="panel bay"><div class="bay-top"><strong>Bay ${esc(d.pickerBlock)}${bay}</strong></div><div class="hallway north">LORONG / HALLWAY · UTARA</div><div class="slots">${[1,3,2,4].map(slot=>{const l=ls.find(l=>l.block===d.pickerBlock&&l.bay===bay&&l.slot===slot);if(!l)return '<div class="missing-slot">Tidak tersedia</div>';const state=moveTargetState(l.id);return `<button class="slot move-target ${state.chosen?'selected':''}" data-action="move-target" data-id="${esc(l.id)}" ${state.disabled?'disabled':''} aria-pressed="${state.chosen}" aria-label="Tujuan ${esc(l.display)}: ${esc(state.label)}"><span class="slot-id">${esc(l.display)}</span><span data-move-state>${esc(state.label)}</span></button>`;}).join('')}</div></section>`).join('')}</div><div class="workflow-save move-save"><strong id="move-progress">${d.merge?(d.rows.some(r=>r.destination)?'1':'0')+'/1 tujuan gabungan dipilih':d.rows.filter(r=>r.destination).length+'/'+d.rows.length+' tujuan dipilih'}</strong>${btn('Periksa pasangan','move-review','primary','check')}</div>`;
}
function moveActiveMarkup(){const d=S.moveDraft,r=d.rows[d.picking];if(d.merge)return '<strong>'+ (r?'Pilih satu tujuan untuk seluruh gabungan':'Tujuan gabungan sudah dipilih')+'</strong>'+mergePreview();return r?`<small>Tujuan untuk item ${d.picking+1} dari ${d.rows.length}</small><div class="move-item">${moveItemMarkup(r)}</div>`:'<strong>Semua tujuan sudah dipilih.</strong><p>Tekan Periksa pasangan sebelum menyimpan.</p>';}
function moveTargetState(id){const d=S.moveDraft,chosen=d.rows.some(r=>r.destination===id),occupants=stockAt(id),selected=new Set(d.rows.map(r=>r.item.id)),blocked=occupants.some(i=>!d.merge||!selected.has(i.id));return {chosen,disabled:chosen||blocked||d.picking<0,label:chosen?'Tujuan dipilih':blocked?'Terisi':occupants.length?'Asal pilihan':'Kosong'};}
function chooseMoveTarget(id){const d=S.moveDraft,r=d.rows[d.picking],loc=locs(null).find(l=>l.id===id&&l.kind==='rack');if(!r||!loc||moveTargetState(id).disabled)return;
 for(const row of d.rows)if(d.merge||row===r||r.item.palletId&&row.item.palletId===r.item.palletId)row.destination=id;d.expected[id]=Offline.fingerprint(S.data,id);S.formDirty=true;
 const next=d.rows.findIndex((row,n)=>n>d.picking&&!row.destination);d.picking=next>=0?next:d.rows.findIndex(row=>!row.destination);
 // Preserve grid nodes and scroll while automatically advancing the item prompt.
 $('#move-active').innerHTML=moveActiveMarkup();$('#move-progress').textContent=d.merge?'1/1 tujuan gabungan dipilih':d.rows.filter(row=>row.destination).length+'/'+d.rows.length+' tujuan dipilih';
 $$('.move-target').forEach(el=>{const state=moveTargetState(el.dataset.id);el.disabled=state.disabled;el.classList.toggle('selected',state.chosen);el.setAttribute('aria-pressed',String(state.chosen));el.querySelector('[data-move-state]').textContent=state.label;const loc=locs(null).find(l=>l.id===el.dataset.id);el.setAttribute('aria-label','Tujuan '+loc.display+': '+state.label);});
}
function showMovePage(){render();window.scrollTo({top:0,behavior:'instant'});}
function leaveMove(){if(!Navigation.allowLeave())return;const d=S.moveDraft;S.moveDraft=null;S.room=d?.room||S.room;nav('storage');window.scrollTo({top:d?.scroll||0,behavior:'instant'});}
async function saveMovement(){const d=S.moveDraft;if(!d||S.busy)return;
 try{WMS.assert(d.rows.length&&d.rows.every(r=>r.destination),'Pilih tujuan untuk setiap item.');
  for(const id of new Set(d.rows.flatMap(r=>[r.from,r.destination])))WMS.assert(d.expected[id]===Offline.fingerprint(S.data,id),'Data asal/tujuan berubah. Kembali ke Bay dan susun ulang perpindahan.');
  if(await mutate(d.merge?{action:'mergePallet',ids:d.rows.map(r=>r.item.id),destination:d.rows[0].destination}:{action:'moveBatch',rows:d.rows.map(r=>({itemId:r.item.id,from:r.from,destination:r.destination}))})){leaveMove();toast('Semua barang dipindahkan'+(gas?' di HP · Menunggu SYNC.':'.'));}
 }catch(e){storageError(e);}
}
document.addEventListener('change',e=>{if(e.target.id==='move-picker-room'&&!S.busy){S.moveDraft.pickerRoom=e.target.value;S.moveDraft.pickerBlock='';showMovePage();}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||S.busy)return;const d=S.moveDraft;switch(b.dataset.action){
 case 'move-normal':setMergeMode(false);break;
 case 'move-merge':setMergeMode(true);break;
 case 'move-choose':d.picking=Number(b.dataset.index);{const l=S.data.locations.find(l=>l.id===(d.rows[d.picking].destination||d.rows[d.picking].from));d.pickerRoom=l?.kind==='rack'?l.room:movePickerRooms()[0];d.pickerBlock=l?.block||'';}showMovePage();break;
 case 'move-remove':{const removed=d.rows[Number(b.dataset.index)];d.rows=d.rows.filter(r=>r!==removed&&(!removed.item.palletId||r.item.palletId!==removed.item.palletId));}S.formDirty=true;if(!d.rows.length){Navigation.saved();leaveMove();}else showMovePage();break;
 case 'move-block':d.pickerBlock=b.dataset.block;showMovePage();break;
 case 'move-target':chooseMoveTarget(b.dataset.id);break;
 case 'move-review':d.picking=null;showMovePage();break;
 case 'move-exit':leaveMove();break;
 case 'move-save':await saveMovement();break;
}});

function mergePreview(){const rows=S.moveDraft.rows.map(r=>r.item),numbers=[...new Set(rows.flatMap(i=>Pallets.label(i).split(',')))];return '<div class="panel workflow-panel"><h2>P '+esc(numbers.join(','))+'</h2><p>'+number(rows.reduce((n,i)=>n+i.qty,0))+' '+esc(rows[0]?.unit||'CTN')+' · 1 pallet fisik</p><p class="notice">Rincian asal tetap disimpan. Produk, KP, satuan, dan status harus sama; kode SPV/notes tetap mengikuti masing-masing asal. Penggabungan tidak membuat transaksi IN/OUT.</p></div>';}
function setMergeMode(value){const d=S.moveDraft;try{if(value){const rows=d.rows.map(r=>r.item),first=rows[0];WMS.assert(Pallets.count(rows)>=2,'Pilih minimal dua pallet fisik.');WMS.assert(rows.every(i=>['sku','kp','unit','status'].every(k=>i[k]===first[k])),'Gabungkan hanya produk, KP, satuan, dan status yang sama.');WMS.assert(rows.every(i=>i.palletNo),'Isi nomor pallet asal terlebih dahulu.');}d.merge=value;d.picking=null;d.rows.forEach(r=>r.destination='');S.formDirty=true;showMovePage();}catch(e){toast(errorText(e));}}

/* Dedicated transaction exports; the daily WhatsApp stock report is unchanged. */
function exportDashboardCard(){return `<section class="panel report-banner export-banner"><div class="report-icon">${icon('report',24)}</div><div class="grow"><h3>Ekspor Excel</h3><p>Riwayat barang masuk dan keluar untuk kartu stok.</p></div>${btn('Buka Ekspor','export-open','','download')}</section>`;}
function exportState(){if(!S.excel||S.excel.mode!==S.mode)S.excel={mode:S.mode,type:'IN',from:S.session.date,to:S.session.date,shift:S.session.shift,room:'',header:false,result:null,loading:false,error:''};return S.excel;}
function exportView(){const x=exportState();return `${sessionBar()}${workNavigation()}<div class="intro-line"><div><span class="eyebrow">KARTU STOK · ${esc(S.mode)}</span><h1>Ekspor Excel</h1><p class="sub">Salin transaksi ke Excel. Laporan WhatsApp tetap untuk posisi stok saat ini.</p></div>${btn('Muat riwayat terbaru','export-load','','refresh')}</div><div class="export-tabs" role="tablist" aria-label="Jenis transaksi">${['IN','OUT','KOREKSI'].map(t=>`<button class="btn ${x.type===t?'primary':''}" role="tab" aria-selected="${x.type===t}" data-action="export-tab" data-type="${t}">${t==='IN'?'IN · Barang masuk':t==='OUT'?'OUT · Barang keluar':'Koreksi data'}</button>`).join('')}</div><section class="panel export-panel"><div class="export-filters"><label>Dari tanggal<input class="field" type="date" data-export-field="from" value="${esc(x.from)}"></label><label>Sampai tanggal<input class="field" type="date" data-export-field="to" value="${esc(x.to)}"></label><label>Shift<select class="field" data-export-field="shift"><option value="">Semua shift</option>${opts(['S1','S2','S3'],x.shift)}</select></label><label>Ruangan<select class="field" data-export-field="room"><option value="">Seluruh ${esc(S.mode)}</option>${opts(rooms(),x.room)}</select></label></div><div class="export-options">${btn('Seluruh periode','export-all','small')}${btn('Shift aktif','export-current','small')}<label class="row"><input type="checkbox" data-export-field="header" ${x.header?'checked':''}> Sertakan header</label></div><p class="notice">Tanggal mengikuti tanggal operasional sesi penerimaan / konfirmasi keluar. IN merekam jumlah saat diterima, bukan saldo sekarang. OUT hanya barang keluar yang sudah dikonfirmasi.</p><p class="notice">Riwayat IN mulai dicatat oleh patch v1.5.7. Stok lama tidak dibuat menjadi penerimaan baru. Nomor pallet dan KP memakai data pada saat transaksi. Format v1.6.2 memuat ID Item asal dan No. SJ; gunakan template Excel v1.6.2. No. SJ hanya berisi nomor SAP yang diisi saat konfirmasi keluar. Dokumen lama tanpa SJ tetap kosong; nomor DN internal bukan nomor SAP.</p><div id="export-results">${exportResults()}</div></section>`;}
function exportSelection(){const x=exportState();return StockExport.select(x.result?.rows||[],S.mode,x);}
function exportResults(){const x=exportState(),pending=offlineCount();let rows=[];try{rows=exportSelection();}catch(e){return `<div class="error">${esc(errorText(e))}</div>`;}
 const problems=StockExport.issues(rows),blocked=!x.result||x.loading||!rows.length||problems.length||gas&&pending>0;
 const header=StockExport.headers[x.type],ctn=rows.filter(r=>r.unit==='CTN').reduce((n,r)=>n+Number(r.qty),0);
 return `${pending?`<div class="error">${pending} transaksi masih tersimpan di HP. Tekan SYNC, lalu muat riwayat terbaru sebelum menyalin laporan pusat. ${btn('SYNC','export-sync','small','refresh')}</div>`:''}${x.error?`<div class="error">${esc(x.error)}</div>`:''}${x.loading?'<p role="status">Memuat riwayat transaksi…</p>':''}${!x.result&&!x.loading?'<p class="notice">Tekan Muat riwayat terbaru untuk mengambil data.</p>':''}${x.result?`<div class="export-summary"><div><strong>${number(rows.length)} baris · ${number(ctn)} CTN</strong><p class="notice">${gas?'Data pusat':'Data pratinjau lokal'} dimuat ${esc(new Date(x.result.asOf).toLocaleString('id-ID'))}. ${navigator.onLine===false?'Offline — menampilkan data yang terakhir dimuat.':''}</p></div>${btn('Salin '+x.type+' untuk Excel','export-copy','primary','copy',blocked?'disabled':'')}</div>`:''}${rows.some(r=>r.identityRepaired)?'<p class="notice">Identitas laporan lama dipisahkan berdasarkan SKU. Gunakan file Excel v1.6.2 agar identitas IN/OUT cocok.</p>':''}${problems.length?`<div class="error">${problems.map(esc).join('<br>')}<br>Penyalinan diblokir agar kode dan satuan Excel tidak salah.</div>`:''}${rows.some(r=>r.type==='OUT'&&!r.sjNumber)?'<p class="notice">Ada pengeluaran lama tanpa No. SJ SAP. Cocokkan dengan dokumen admin; nomor DN internal tidak digunakan sebagai pengganti.</p>':''}${rows.some(r=>!r.shift)?'<p class="notice">Ada DN lama tanpa identitas shift konfirmasi. Shift dibiarkan kosong; jangan dianggap sebagai shift pembuatan picking.</p>':''}${x.result&&!rows.length?'<p class="activity-empty">Tidak ada transaksi yang cocok. Coba Seluruh periode atau periksa filter. Data sebelum pencatatan IN dimulai memang tidak tersedia.</p>':''}${rows.length?`<div class="export-table-wrap" tabindex="0" aria-label="Pratinjau transaksi, geser untuk melihat semua kolom"><table class="export-table"><thead><tr>${header.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,100).map(r=>`<tr>${StockExport.values(r).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="notice">Pratinjau ${Math.min(100,rows.length)} dari ${rows.length} baris. Tombol Salin mencakup seluruh hasil filter. Paste tanpa header di bawah header tabel INPUT_IN, INPUT_OUT, atau KOREKSI. Untuk template trial ini mulai A4. Hindari ID Trans duplikat. Kolom tersembunyi tetap ikut terisi. IN 14 kolom, OUT 18 kolom, KOREKSI 25 kolom. Ekspor koreksi terpisah; jangan menambahkan kembali IN lama. QTY dalam CTN. Format tanggal YYYY-MM-DD.</p><p class="notice">ID Trans tetap sama saat diekspor ulang. Copy-paste tidak menghapus duplikat otomatis: periksa ID sebelum menambah data. Ekspor seluruh periode digunakan untuk mengisi ulang tabel, bukan menambahkan transaksi yang sama.</p>`:''}`;
}
function refreshExportResults(){const el=$('#export-results');if(el)el.innerHTML=exportResults();}
async function loadExport(){const x=exportState();if(x.loading)return;x.loading=true;x.error='';refreshExportResults();try{
 let result;if(gas){WMS.assert(navigator.onLine!==false,'Perlu koneksi untuk memuat riwayat pusat.');result=await call('getStockExport',S.session.id);}
 else {const data=localData();result={schema:StockExport.schema,mode:S.mode,rows:StockExport.allRows(data.transactions||[],data.deliveryNotes||[],data.exportSessions||[],S.mode),asOf:new Date().toISOString()};}
 WMS.assert(result&&result.mode===x.mode&&Array.isArray(result.rows),'Data ekspor tidak sesuai gudang.');WMS.assert(result.schema===StockExport.schema,'Versi ekspor belum cocok. Update Index dan Code.gs dari paket v1.6.2, Deploy → New version, lalu buka ulang aplikasi.');x.result=result;
 }catch(e){x.error=/is not a function/.test(errorText(e))?'Fungsi ekspor belum tersedia pada deployment yang dibuka. Pastikan Index dan Code.gs berasal dari paket yang sama, lalu Deploy → New version dan buka ulang URL deployment itu. Ini bukan karena riwayat IN kosong.':errorText(e);x.result=null;}finally{x.loading=false;if(S.page==='exports'&&S.excel===x)refreshExportResults();}}
async function copyExport(){const x=exportState();try{
 WMS.assert(x.result&&!x.loading,'Muat riwayat terlebih dahulu.');WMS.assert(!gas||offlineCount()===0,'SYNC antrean HP dan muat riwayat terlebih dahulu.');WMS.assert(x.result.schema===StockExport.schema,'Muat ulang riwayat dari deployment v1.6.2 sebelum menyalin.');const rows=exportSelection();WMS.assert(rows.length,'Tidak ada transaksi untuk disalin.');const text=StockExport.tsv(rows,x.type,x.header);
 try{if(!navigator.clipboard?.writeText)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(text);toast(rows.length+' baris '+x.type+' disalin. Paste ke Excel.');}
 catch{openModal('Salin '+x.type+' untuk Excel','Pilih seluruh teks lalu salin. Kolom dipisahkan tab.',`<textarea id="export-copy-text" class="field" rows="12" readonly aria-label="Teks ekspor Excel">${esc(text)}</textarea>`,btn('Tutup','close-modal'));const el=$('#export-copy-text');el.focus();el.select();}
 }catch(e){toast(errorText(e));}}
document.addEventListener('change',e=>{const key=e.target.dataset.exportField;if(!key)return;const x=exportState();x[key]=key==='header'?e.target.checked:e.target.value;refreshExportResults();});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||S.busy)return;const a=b.dataset.action;if(!a.startsWith('export-'))return;
 if(a==='export-open'){if(!S.session)return;exportState();if(nav('exports'))await loadExport();}
 else if(a==='export-load')await loadExport();
 else if(a==='export-tab'){exportState().type=b.dataset.type;render();}
 else if(a==='export-all'){Object.assign(exportState(),{from:'',to:'',shift:''});render();}
 else if(a==='export-current'){Object.assign(exportState(),{from:S.session.date,to:S.session.date,shift:S.session.shift});render();}
 else if(a==='export-copy')await copyExport();
 else if(a==='export-sync'){const x=exportState();x.result=null;if(await syncOfflineData())await loadExport();}
});

/* Corrections use the same durable outbox and atomic backend commit as stock. */
function openCorrection(itemId){
 const candidates=stockAt(S.editor.loc.id),old=candidates.find(i=>i.id===itemId)||candidates[0];
 if(!old)return toast('Tidak ada barang untuk dikoreksi.');
 S.correction={old:JSON.parse(JSON.stringify(old)),request:null};
 const field=(key,label,type='text')=>`<label>${label}<input class="field" data-correction="${key}" type="${type}" ${key==='qty'?'min="1" max="1000000" step="1" inputmode="numeric"':key==='palletNo'?'inputmode="numeric" maxlength="20"':''} value="${esc(old[key]||'')}"></label>`;
 openModal('Koreksi data barang','Perbaiki salah input. Barang baru ditambahkan sebagai item baru.',`<div id="action-error"></div><label>Pilih item<select class="field" id="correction-item">${candidates.map(i=>`<option value="${esc(i.id)}" ${i.id===old.id?'selected':''}>${esc(i.sku)} · KP ${esc(WMS.short(i.kp))} · PP ${esc(Pallets.label(i))} · ${i.qty} CTN</option>`).join('')}</select></label><div class="two-col"><label>SKU<select class="field" data-correction="sku">${opts(S.data.skus.filter(s=>s.group===S.mode).map(s=>s.code),old.sku)}</select></label>${field('kp','Kode produksi','date')}${field('qty','QTY yang benar','number')}${field('palletNo','No. pallet')}${S.mode==='CSFG'?`<label>SPV<select class="field" data-correction="spv">${opts(['JT','HW','AK','-'],old.spv)}</select></label>`:''}</div>${field('note','Catatan barang')}<label>Alasan koreksi (wajib)<input class="field" id="correction-reason" maxlength="500" placeholder="Contoh: salah input 30, fisik masuk 25"></label><p class="notice">QTY adalah stok fisik yang tersisa sekarang. Status QC tetap melalui editor biasa. Identitas yang sudah dipakai SJ memerlukan rekonsiliasi admin.</p><div id="correction-review"></div>`,btn('Tinjau perubahan','correction-review','primary')+btn('Kembali','correction-back'));
}
// Existing quantities are edited intentionally through corrections; new items remain ordinary IN.
const originalRenderEditor162=renderEditor;
renderEditor=function(){originalRenderEditor162();$$('.item-editor').forEach((el,n)=>{if(!S.editor.items[n]?.id)return;for(const key of ['sku','kp','qty','palletNo','spv']){const field=el.querySelector(`[data-field="${key}"]`);if(field)field.disabled=true;}});const notice=document.createElement('p');notice.className='notice';notice.textContent='Salah input SKU, KP, QTY, pallet, atau SPV? Gunakan Koreksi data. Untuk produk baru, pilih Tambah item.';$('#editor-items').before(notice);};
function reviewCorrection(){
 try{const c=S.correction,item={...c.old};$$('[data-correction]').forEach(el=>item[el.dataset.correction]=el.value);item.qty=Number(item.qty);
  const request={action:'correctItem',itemId:c.old.id,before:c.old,item,reason:$('#correction-reason').value.trim(),version:S.data.version};
  Delivery.mutate(S.data,request,S.session,uid,new Date().toISOString());c.request=request;
  const names={sku:'SKU',kp:'KP',qty:'QTY',palletNo:'No. pallet',spv:'SPV',note:'Catatan'};
  $('#correction-review').innerHTML='<h3>Perubahan yang akan disimpan</h3>'+Object.keys(names).filter(k=>String(c.old[k]??'')!==String(item[k]??'')).map(k=>`<p>${names[k]}: <b>${esc(c.old[k]||'—')}</b> → <b>${esc(item[k]||'—')}</b></p>`).join('')+`<p>Alasan: ${esc(request.reason)}</p>`+btn('Konfirmasi koreksi','correction-save','primary');
 }catch(e){storageError(e);}
}
document.addEventListener('change',e=>{if(e.target.id==='correction-item')openCorrection(e.target.value);});
document.addEventListener('input',e=>{if(e.target.matches('[data-correction],#correction-reason')&&S.correction){S.correction.request=null;$('#correction-review').innerHTML='';}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||S.busy)return;
 if(b.dataset.action==='correction-open')openCorrection();
 if(b.dataset.action==='correction-back')openEditor(S.editor.loc.id);
 if(b.dataset.action==='correction-review')reviewCorrection();
 if(b.dataset.action==='correction-save'&&S.correction?.request){if(await mutate(S.correction.request)){S.correction=null;closeModal();render();toast('Koreksi tersimpan. Ekspor KOREKSI untuk memperbarui kartu stok.');}}
});

boot();</script></body></html>
